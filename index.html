<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vynzo Reward</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-dark: #020617;
      --primary-cyan: #00f2fe;
      --primary-blue: #38ef7d;
      --accent-purple: #7f00ff;
      --accent-pink: #ff007f;
      --text-white: #ffffff;
      --text-dim: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
      user-select: none;
    }

    /* Double Glowing Background (Top Cyan Blue + Bottom Deep Purple Glow) */
    body {
      background: radial-gradient(circle at 50% 0%, #0a192f 0%, #020617 70%);
      color: var(--text-white);
      height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    /* Bottom Dual Color Glow Orbs */
    .bg-glow-bottom-left {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(127, 0, 255, 0.35) 0%, rgba(0,0,0,0) 70%);
      bottom: -120px;
      left: -80px;
      z-index: 0;
      filter: blur(60px);
      pointer-events: none;
    }

    .bg-glow-bottom-right {
      position: absolute;
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, rgba(0, 242, 254, 0.3) 0%, rgba(0,0,0,0) 70%);
      bottom: -120px;
      right: -80px;
      z-index: 0;
      filter: blur(60px);
      pointer-events: none;
    }

    /* Falling Glowing Pearl Particles Canvas */
    #pearlsCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* Glassmorphism Card Style */
    .glass-card {
      background: rgba(15, 23, 42, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 36px 28px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.15);
    }

    /* Pure 360 Spin ONLY for V Letter */
    .brand-logo-badge {
      width: 95px;
      height: 95px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(0, 242, 254, 0.15), rgba(127, 0, 255, 0.2));
      border: 2px solid rgba(0, 242, 254, 0.5);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .brand-v-letter {
      font-size: 52px;
      font-weight: 800;
      background: linear-gradient(135deg, #00f2fe 0%, #4facfe 50%, #7f00ff 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: spinV360 3s linear infinite;
      display: inline-block;
      transform-style: preserve-3d;
    }

    @keyframes spinV360 {
      0% { transform: rotateY(0deg); }
      100% { transform: rotateY(360deg); }
    }

    .brand-title {
      font-size: 28px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 6px;
      background: linear-gradient(to right, #ffffff, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand-subtitle {
      font-size: 13px;
      color: var(--text-dim);
      margin-bottom: 28px;
    }

    /* Screen Management */
    .screen {
      display: none;
      width: 100%;
    }

    .screen.active {
      display: block;
    }

    /* Loader Screen */
    .progress-bar-container {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 20px;
      overflow: hidden;
      margin: 20px 0 12px;
      border: 1px solid rgba(255, 255, 255, 0.05);
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00f2fe, #7f00ff);
      border-radius: 20px;
      box-shadow: 0 0 12px rgba(0, 242, 254, 0.6);
      transition: width 0.1s linear;
    }

    .progress-text {
      font-size: 16px;
      font-weight: 700;
      color: var(--primary-cyan);
    }

    .loader-status {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 8px;
    }

    /* Login Screen Rules Checkbox */
    .rules-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin-bottom: 24px;
      font-size: 13px;
      color: var(--text-dim);
      cursor: pointer;
    }

    .rules-container input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: var(--primary-cyan);
      cursor: pointer;
    }

    /* Google Login Button */
    .btn-google {
      width: 100%;
      padding: 14px 20px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-white);
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
    }

    .btn-google:not(:disabled):hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: var(--primary-cyan);
      box-shadow: 0 0 25px rgba(0, 242, 254, 0.4);
      transform: translateY(-2deg);
    }

    .btn-google:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      border-color: rgba(255, 255, 255, 0.05);
    }

    .btn-google svg {
      width: 20px;
      height: 20px;
    }

    /* Home Screen Preview */
    .user-profile-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.05);
      padding: 12px 16px;
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 20px;
      text-align: left;
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--primary-cyan);
    }

    .user-info h4 {
      font-size: 15px;
      font-weight: 600;
    }

    .user-info p {
      font-size: 12px;
      color: var(--text-dim);
    }

    .btn-logout {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid rgba(255, 0, 127, 0.3);
      background: rgba(255, 0, 127, 0.1);
      color: var(--accent-pink);
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-logout:hover {
      background: rgba(255, 0, 127, 0.25);
    }
  </style>
</head>
<body>

  <!-- Bottom Dual Glowing Effects -->
  <div class="bg-glow-bottom-left"></div>
  <div class="bg-glow-bottom-right"></div>

  <!-- Falling Glowing Pearl Particles Canvas -->
  <canvas id="pearlsCanvas"></canvas>

  <div class="app-container">
    <div class="glass-card">
      
      <!-- Brand Logo Header (V Letter Rotating 360) -->
      <div class="brand-logo-badge">
        <span class="brand-v-letter">V</span>
      </div>
      <h1 class="brand-title">Vynzo Reward</h1>
      <p class="brand-subtitle">Play, Earn & Redeem Rewards</p>

      <!-- 1. LOADING SCREEN (0% to 100%) -->
      <div id="loadingScreen" class="screen active">
        <div class="progress-bar-container">
          <div id="progressFill" class="progress-bar-fill"></div>
        </div>
        <div id="progressText" class="progress-text">0%</div>
        <div id="loaderStatus" class="loader-status">Welcome to Vynzo Reward...</div>
      </div>

      <!-- 2. LOGIN SCREEN -->
      <div id="loginScreen" class="screen">
        <label class="rules-container">
          <input type="checkbox" id="ageCheck">
          <span>I am 18+ years old & agree to rules</span>
        </label>

        <button id="googleLoginBtn" class="btn-google" disabled>
          <svg viewBox="0 0 24 24">
            <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.3 9 5 12 5z"/>
            <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
            <path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 10.8 0 12s.7 2.3 1.9 4.7l3.7-2.9z"/>
            <path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2.3-6.4-5.2L1.9 16c1.8 3.7 5.6 7 10.1 7z"/>
          </svg>
          Continue with Google
        </button>
      </div>

      <!-- 3. HOME SCREEN -->
      <div id="homeScreen" class="screen">
        <div class="user-profile-badge">
          <img id="userAvatar" class="user-avatar" src="https://via.placeholder.com/44" alt="User">
          <div class="user-info">
            <h4 id="userName">User Name</h4>
            <p id="userEmail">user@gmail.com</p>
          </div>
        </div>

        <div style="padding: 20px 0; color: var(--primary-cyan); font-weight: 600;">
          🎉 Login Successful! Ready to build Home Page.
        </div>

        <button id="logoutBtn" class="btn-logout">Logout</button>
      </div>

    </div>
  </div>

  <script type="module">
    import { 
      auth, 
      googleProvider, 
      db, 
      signInWithPopup, 
      signOut, 
      onAuthStateChanged, 
      doc, 
      getDoc, 
      setDoc 
    } from './firebase.js';

    const loadingScreen = document.getElementById('loadingScreen');
    const loginScreen = document.getElementById('loginScreen');
    const homeScreen = document.getElementById('homeScreen');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const loaderStatus = document.getElementById('loaderStatus');
    const ageCheck = document.getElementById('ageCheck');
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    const logoutBtn = document.getElementById('logoutBtn');

    // Canvas Background
    const canvas = document.getElementById('pearlsCanvas');
    const ctx = canvas.getContext('2d');
    
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const colors = [
      'rgba(0, 242, 254, ',   
      'rgba(127, 0, 255, ',   
      'rgba(255, 0, 127, ',   
      'rgba(255, 215, 0, ',   
      'rgba(255, 255, 255, '   
    ];

    class Pearl {
      constructor() { this.reset(); }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -100;
        this.radius = Math.random() * 3 + 1.5;
        this.speed = Math.random() * 1.5 + 0.8;
        this.colorPrefix = colors[Math.floor(Math.random() * colors.length)];
        this.alpha = Math.random() * 0.6 + 0.3;
      }
      update() {
        this.y += this.speed;
        this.x += Math.sin(this.y * 0.01) * 0.5;
        if (this.y > canvas.height + 10) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fillStyle = this.colorPrefix + this.alpha + ')';
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.colorPrefix + '1)';
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    const pearls = Array.from({ length: 45 }, () => new Pearl());
    function animatePearls() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pearls.forEach(p => { p.update(); p.draw(); });
      requestAnimationFrame(animatePearls);
    }
    animatePearls();

    // 0 to 100 Loader
    let progress = 0;
    const loaderInterval = setInterval(() => {
      progress += 2;
      progressFill.style.width = progress + '%';
      progressText.innerText = progress + '%';

      if (progress >= 100) {
        clearInterval(loaderInterval);
        checkAuthAndNavigate();
      }
    }, 30);

    function showScreen(screen) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      screen.classList.add('active');
    }

    function checkAuthAndNavigate() {
      onAuthStateChanged(auth, async (user) => {
        if (user) {
          document.getElementById('userName').innerText = user.displayName || 'User';
          document.getElementById('userEmail').innerText = user.email || '';
          document.getElementById('userAvatar').src = user.photoURL || 'https://via.placeholder.com/44';
          
          try {
            const userRef = doc(db, 'users', user.uid);
            const userSnap = await getDoc(userRef);
            if (!userSnap.exists()) {
              await setDoc(userRef, {
                uid: user.uid,
                name: user.displayName,
                email: user.email,
                gems: 0,
                createdAt: new Date().toISOString()
              });
            }
          } catch (e) {
            console.log("Firestore Notice:", e);
          }

          showScreen(homeScreen);
        } else {
          showScreen(loginScreen);
        }
      });
    }

    // Checkbox & Google Login Handler
    ageCheck.addEventListener('change', (e) => {
      googleLoginBtn.disabled = !e.target.checked;
    });

    googleLoginBtn.addEventListener('click', async () => {
      try {
        await signInWithPopup(auth, googleProvider);
      } catch (error) {
        console.error(error);
        alert("Google Login Error: " + error.message + "\n\nTip: Ensure localhost or your domain is added in Firebase Auth Settings -> Authorized Domains.");
      }
    });

    logoutBtn.addEventListener('click', async () => {
      await signOut(auth);
      showScreen(loginScreen);
    });
  </script>
</body>
</html>
